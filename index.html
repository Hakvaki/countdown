<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown to 31.12.2028</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0f1220;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;box-sizing:border-box}
  h1{font-size:clamp(16px,3.5vw,28px);font-weight:600;margin:0 0 20px;text-align:center}
  .row{display:flex;gap:clamp(6px,1.5vw,16px);flex-wrap:wrap;justify-content:center}
  .box{background:#1c2140;border-radius:12px;padding:clamp(10px,2vw,22px);min-width:clamp(60px,14vw,120px);text-align:center}
  .num{font-size:clamp(28px,7vw,64px);font-weight:700;font-variant-numeric:tabular-nums}
  .lbl{font-size:clamp(10px,1.8vw,14px);text-transform:uppercase;letter-spacing:.1em;opacity:.7;margin-top:4px}
  #done{margin-top:18px;font-size:20px;display:none}
</style>
</head>
<body>
<h1>Countdown to 31.12.2028</h1>
<div class="row">
  <div class="box"><div class="num" id="y">00</div><div class="lbl">Years</div></div>
  <div class="box"><div class="num" id="d">000</div><div class="lbl">Days</div></div>
  <div class="box"><div class="num" id="h">00</div><div class="lbl">Hours</div></div>
  <div class="box"><div class="num" id="m">00</div><div class="lbl">Minutes</div></div>
  <div class="box"><div class="num" id="s">00</div><div class="lbl">Seconds</div></div>
</div>
<div id="done">Time's up</div>
<script>
const target = new Date(2028, 11, 31, 23, 59, 59);
const pad = (n, l = 2) => String(n).padStart(l, "0");
const set = (id, v) => document.getElementById(id).textContent = v;

function tick() {
  const now = new Date();
  if (now >= target) {
    set("y","00"); set("d","000"); set("h","00"); set("m","00"); set("s","00");
    document.getElementById("done").style.display = "block";
    return;
  }
  let years = target.getFullYear() - now.getFullYear();
  let base = new Date(now); base.setFullYear(now.getFullYear() + years);
  if (base > target) { years--; base = new Date(now); base.setFullYear(now.getFullYear() + years); }
  let diff = Math.floor((target - base) / 1000);
  const days = Math.floor(diff / 86400); diff %= 86400;
  const hours = Math.floor(diff / 3600); diff %= 3600;
  const mins = Math.floor(diff / 60);
  set("y", pad(years)); set("d", pad(days, 3)); set("h", pad(hours));
  set("m", pad(mins)); set("s", pad(diff % 60));
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
